[project]
name = "fiveu-backend"
version = "0.1.0"
description = "Shared 5U START Munich backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]",
  "pydantic-settings",
  "httpx",
  # Readers for customer documents: dangerous-goods papers arrive as PDF or spreadsheet.
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]
# Follow-up tariff parser (app/pricing/parsers). NOT needed for `make demo` / T2 acceptance.
# Install with: uv sync --group parsers   (system: tesseract-ocr, poppler-utils for the scans/PDFs)
parsers = [
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "pillow>=10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
